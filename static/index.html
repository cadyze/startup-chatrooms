<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat</title>
</head>
<body>
    <h2>WebSocket Chat</h2>
    <textarea id="output" rows="10" cols="50" readonly></textarea><br><br>
    <input id="input" type="text" placeholder="Type a message..." />
    <button onclick="sendMessage()">Send</button>

    <div>
        <a href="/login">
            <button id="login-button">Login with Google</button>
        </a>
    </div>

    <div id="user-info" style="display: none;">
        <img id="user-icon" src="" alt="User Icon" width="50" height="50">
        <p id="user-name"></p>
        <p id="user-email"></p>
    </div>

    <script>
        var ws = new WebSocket("ws://localhost:8080/ws");

        ws.onopen = function() {
            document.getElementById('output').value += "Connected to WebSocket server\n";
        };

        ws.onmessage = function(event) {
            document.getElementById('output').value += "Received: " + event.data + "\n";
        };

        function sendMessage() {
            var input = document.getElementById('input').value;
            ws.send(input);
            document.getElementById('input').value = ''; // Clear input after sending
        }

        ws.onclose = function() {
            document.getElementById('output').value += "WebSocket connection closed\n";
        };

        // Check for user info cookie
        function getCookie(name) {
            let cookieArr = document.cookie.split(";");
            for (let i = 0; i < cookieArr.length; i++) {
                let cookiePair = cookieArr[i].split("=");
                if (name == cookiePair[0].trim()) {
                    return decodeURIComponent(cookiePair[1]);
                }
            }
            return null;
        }

        let userInfo = getCookie("user_info");
        if (userInfo) {
            let [email, name, picture] = userInfo.split("|");
            document.getElementById("user-email").innerText = email;
            document.getElementById("user-name").innerText = name;
            document.getElementById("user-icon").src = picture;
            document.getElementById("login-button").style.display = "none";
            document.getElementById("user-info").style.display = "block";
        }
    </script>
</body>
</html>
